name: ATI Bourse Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas numpy
          fi

      - name: Run ATI Bourse Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "================================"
          echo "ATI BOURSE BOT"
          echo "RUN START"
          echo "================================"
          python main.py
          echo "================================"
          echo "ATI BOURSE BOT"
          echo "RUN FINISHED"
          echo "================================"

مسیر دقیق فایل:

"ATI-Bourse-Bot → .github → workflows → main.yml"

این نسخه هر ۵ دقیقه "main.py" بورس را اجرا می‌کند و کلیدهای تلگرام را از GitHub Secrets می‌گیرد.

فقط دقت کن: این "main.yml" منطق خرید و فروش بورس را نمی‌سازد؛ آن قسمت باید داخل "main.py" باشد.
